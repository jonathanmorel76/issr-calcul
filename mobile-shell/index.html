<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#164f55">
  <title>Mon Remplacement Beta</title>
  <style>
    html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#164f55;color:#fff}
    main{height:100%;display:grid;place-items:center;text-align:center;padding:32px;box-sizing:border-box}
    .card{max-width:420px}.mark{width:64px;height:64px;margin:0 auto 20px;border-radius:18px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:32px;font-weight:800}.accent{width:64px;height:4px;border-radius:999px;background:#ef8a3a;margin:20px auto}.muted{color:rgba(255,255,255,.72);line-height:1.55}
  </style>
</head>
<body>
  <main><div class="card"><div class="mark">M</div><h1>Mon Remplacement Beta</h1><div class="accent"></div><p class="muted">Impossible de charger l’environnement de préproduction. Vérifiez votre connexion puis relancez l’application.</p></div></main>
</body>
</html>
